<style>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

const DATA = __DATA__;

// ------------------------------------------------------------------ palette (sRGB 0..1)
const hex = h => [parseInt(h.slice(1, 3), 16) / 255, parseInt(h.slice(3, 5), 16) / 255, parseInt(h.slice(5, 7), 16) / 255];
const NIGHT = hex('#09131f'), DEEP = hex('#030913'), SIGNAL = hex('#b48cfa'), HIGHLIGHT = hex('#e6bfff'), DIM1 = hex('#acbcc9'), DIM2 = hex('#78909f');
const WHITE = hex('#f4f1ec'), ORANGE = hex('#ff9d45'), AMBER = hex('#ffb347'), BLUE = hex('#4f9cff'), SKY = hex('#9ec5ff'), CYAN = hex('#62d8ff'),
      TEAL = hex('#5ee6d8'), PINK = hex('#e58bff'), WARM = hex('#ffe2b8'), COLD = hex('#dfe8ff'), RED = hex('#ff6a3d');
const lerp = (a, b, t) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t];
const s2l = v => v <= 0.04045 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4);
const lin = c => [s2l(c[0]), s2l(c[1]), s2l(c[2])];
const col = c => new THREE.Color().setRGB(...lin(c), THREE.LinearSRGBColorSpace);
const css = c => `rgb(${Math.round(c[0] * 255)},${Math.round(c[1] * 255)},${Math.round(c[2] * 255)})`;
const LAST = DATA.weeks - 1;
const BODY_GAIN = 0.82;
const mulberry = seed => () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };

// ------------------------------------------------------------------ district styles: light colour, body tint, window grid, massing
// win: [band pitch, band ratio, columns per unit, column ratio]
const STYLE = {
  core:        { name: 'The Compass',   light: WHITE,  body: hex('#8a8494'), win: [0.5, 0.5, 3, 0.5],     hMul: 1.5,  jitter: 0.1 },
  episodic:    { name: 'The Archive',   light: ORANGE, body: hex('#35485a'), win: [0.45, 0.36, 5, 0.48],   hMul: 1.0,  jitter: 0.3 },
  semantic:    { name: 'The Library',   light: BLUE,   body: hex('#4f5c80'), win: [0.55, 0.26, 2.4, 0.72], hMul: 1.0,  jitter: 0.12 },
  procedural:  { name: 'The Works',     light: COLD,   body: hex('#55555e'), win: [0.7, 0.5, 1.4, 0.6],   hMul: 0.9,  jitter: 0.2 },
  prospective: { name: 'The Yards',     light: AMBER,  body: hex('#5d5348'), win: [0.5, 0.5, 3, 0.5],     hMul: 1.1,  jitter: 0.15 },
  working:     { name: 'Downtown',      light: SIGNAL, body: hex('#6c5f82'), win: [0.36, 0.55, 6, 0.55],  hMul: 1.6,  jitter: 0.25 },
  jhon:        { name: 'The Hills',     light: WARM,   body: hex('#7a6a62'), win: [0.5, 0.45, 3, 0.5],    hMul: 0.75, jitter: 0.25 },
  prasma:      { name: 'Prasma Campus', light: CYAN,   body: hex('#4d6a78'), win: [0.42, 0.5, 4, 0.6],    hMul: 1.05, jitter: 0.18 },
  branding:    { name: 'Signal Row',    light: PINK,   body: hex('#6a4f74'), win: [0.5, 0.5, 3, 0.5],     hMul: 1.0,  jitter: 0.1 },
  onebrain:    { name: 'The Dome',      light: SKY,    body: hex('#4e5a7a'), win: [0.5, 0.5, 3, 0.5],     hMul: 1.0,  jitter: 0.1 },
  reef:        { name: 'The Reef',      light: TEAL,   body: hex('#3f6a66'), win: [0.5, 0.5, 3, 0.5],     hMul: 1.0,  jitter: 0.3 },
  inbox:       { name: 'The Gate',      light: SIGNAL, body: hex('#6c5f82'), win: [0.4, 0.5, 4, 0.5],     hMul: 1.0,  jitter: 0.1 },
};
const styleOf = d => STYLE[d] || { name: 'City block', light: SIGNAL, body: hex('#6c5f82'), win: [0.5, 0.5, 3, 0.5], hMul: 1, jitter: 0.15 };
const FORM_NAME = { box: 'block', shop: 'shophouse', tower: 'tower', hex: 'hex pavilion', cyl: 'round tower', stepped: 'ziggurat', gable: 'house', saw: 'sawtooth shed',
                    slab: 'crowned tower', spire: 'needle', dome: 'dome', sign: 'billboard', scaffold: 'scaffold', plaza: 'plaza', found: 'foundation' };

// ------------------------------------------------------------------ nodes
const nodes = DATA.nodes.map(r => ({
  id: r[0], district: DATA.districts[r[1]], sub: DATA.subs[r[2]], created: r[3], updated: r[4],
  type: DATA.types[r[5]], status: DATA.statuses[r[6]], rc: r[7], inbound: r[8], outbound: r[9], x: r[10], y: r[11],
}));
const byId = new Map(nodes.map(n => [n.id, n]));
const plateauZ = d => DATA.plateaus[d].z;
const appearWeek = n => n.created === null ? 0 : Math.max(0, Math.min(LAST, n.created));

// decay rules, identical to LOG.md
function lightState(n, t) {
  if (n.created === null) return ['foundation', 0];
  if (appearWeek(n) > t) return ['absent', 0];
  if (n.status !== 'active') return ['dark', 0];
  let last = n.created;
  if (n.updated !== null) last = Math.max(last, n.updated);
  let touch = last * 7;
  if (t >= LAST && n.rc > 0) touch = Math.max(touch, LAST * 7);
  const age = t * 7 - touch;
  if (age <= 45) return ['lit', 1];
  if (age >= 90) return ['lit', 0.15];
  return ['lit', 1 - (age - 45) / 45 * 0.85];
}
function bodyColor(n, state, light) {
  const base = styleOf(n.district).body;
  let c;
  if (state === 'foundation') c = lerp(NIGHT, base, 0.25);
  else if (state === 'dark') c = lerp(NIGHT, base, 0.30);
  else c = lerp(NIGHT, base, 0.3 + 0.7 * light);
  return lerp(NIGHT, c, BODY_GAIN);
}
function lightColor(n, light, body) {
  const sig = styleOf(n.district).light;
  const t = Math.max(0, (light - 0.15) / 0.85);
  const c = lerp(lerp(body, sig, 0.3), sig, t);
  return lerp(body, c, 0.3 + 0.7 * light);
}
// form per building: [kind, w, d, h, rotY]
function formOf(n) {
  const f = DATA.design.buildings[n.id];
  if (f) return [f.kind, f.w, f.d, f.h, f.rot];
  const rnd = mulberry(n.id * 7919 + 17);
  const st = styleOf(n.district), t = n.type || '', sub = n.sub || '';

  geo.setAttribute('aBody', attrs.body); geo.setAttribute('aLight', attrs.light); geo.setAttribute('aLit', attrs.lit); geo.setAttribute('aDim', attrs.dim);

function updateWeek(t) {

  for (const n of nodes) {

    const set = kinds[n.kind], a = set.attrs, k = n.slot;
    const aw = appearWeek(n);
    const rise = st === 'absent' ? 0 : (aw === 0 ? 1 : smooth(aw - 0.7, aw, t));
    dummy.position.copy(W(n.x, n.y, plateauZ(n.district)));
    dummy.rotation.set(0, n.rot, 0);
    dummy.scale.set(n.w, Math.max(n.h * rise, 0.0001), n.d);

    const body = bodyColor(n, st, light);

    a.body.setXYZ(k, ...lin(body)); a.light.setXYZ(k, ...lin(lc)); a.lit.setX(k, st === 'lit' ? Math.max(light, 0.15) : 0);
    a.dim.setX(k, state.isolate === null || n.district === state.isolate ? 1 : 0.22);
    n.state = st; n.light = light; n.rise = rise;
    const stats = districtAudio[n.district];

    if (st !== 'absent') { stats.existing++; if (light > 0.5) stats.lit++; }
  }
  for (const stats of Object.values(districtAudio)) {
    stats.density = stats.total ? stats.existing / stats.total : 0;
    stats.brightness = stats.existing ? stats.lit / stats.existing : 0;
  }
  cityAudio.setTimeline(districtAudio);
  for (const set of Object.values(kinds)) { set.mesh.instanceMatrix.needsUpdate = true; for (const at of ['body', 'light', 'lit', 'dim']) set.attrs[at].needsUpdate = true; }
  const colAttr = roadGeo.getAttribute('color');

  edges.forEach((e, i) => {
    let a = e.appear <= t ? (e.appear === 0 ? 1 : smooth(e.appear - 0.35, e.appear + 0.05, t)) : 0;
    if (a > 0) validEdges.push(i);

    const r = e.colour[0] * a, g = e.colour[1] * a, b = e.colour[2] * a;

  antennaNodes.forEach((n, k) => {

}

  else if (e.code === 'ArrowLeft') { state.playing = false; updateWeek(Math.max(0, Math.ceil(state.t - 1e-6) - 1)); slider.value = state.t; }
  else if (e.code === 'KeyR') { state.ride >= 0 ? stopRide() : startRide(); }
  else if (e.code === 'Escape') { if (state.ride >= 0) stopRide(); else { select(-1); setIsolate(null); } }
});

// ------------------------------------------------------------------ post + loop
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(...stageSize()), 0.46, 0.48, 0.76);
composer.addPass(bloom);
composer.addPass(new OutputPass());
let bloomOn = true;

function resize() {
  const [w, h] = stageSize();
  renderer.setSize(w, h); composer.setSize(w, h); bloom.resolution.set(w, h);
  camera.aspect = w / h; camera.updateProjectionMatrix();
  if (state.ride < 0 && state.isolate === null && !focusGoal) placeCamera();
}
window.addEventListener('resize', resize);
if (window.ResizeObserver) new ResizeObserver(resize).observe(stage);
resize();

const clock = new THREE.Clock();
updateWeek(LAST);
window.__vc = { audio: cityAudio, setIsolate, carState, cars, nodes, kinds, edges, state, routes, sampleRoute, poseOnRoute, pointBlocked, clearSight, camera, controls, renderer, people, peopleGroup, startRide, stopRide, updateWeek };
$('city-census').textContent = DATA.districts.length + ' districts / ' + nodes.length.toLocaleString() + ' addresses';
$('loading').classList.add('ready');
function frame() {
  requestAnimationFrame(frame);
  renderer.info.reset();
  const dt = Math.min(clock.getDelta(), 0.1);
  const now = clock.elapsedTime;
  if (state.playing) {
    const t = Math.min(LAST, state.t + dt * (reduced ? 0.6 : 1.1));
    updateWeek(t); slider.value = t;
    if (t >= LAST) { state.playing = false; $('play').textContent = 'Replay'; }
  }
  if (focusGoal) {
    controls.target.lerp(focusGoal.target, 0.08); camera.position.lerp(focusGoal.position, 0.08);
    if (camera.position.distanceTo(focusGoal.position) < 0.05) focusGoal = null;
  }
  updateCars(reduced ? 0 : dt);
  updatePeople(reduced ? 0 : dt, now);
  updateAtmosphere(reduced ? 0 : now);
  craneNodes.forEach((n, k) => { dummy.position.copy(n.craneBase); dummy.rotation.set(0, (reduced ? 0 : now * 0.12) + k * 1.3, 0); dummy.scale.set(1, n.state === 'absent' ? 0.0001 : n.h + 1.4, 1); dummy.updateMatrix(); cranes.mesh.setMatrixAt(k, dummy.matrix); });
  cranes.mesh.instanceMatrix.needsUpdate = true;
  beaconGroup.rotation.y = reduced ? 0 : now * 0.35;
  if (state.ride >= 0) updateRide(dt);
  else { if (ptrDirty) { ptrDirty = false; const hit = pick(); setHover(hit ? hit.idx : -1); } controls.update(); }
  cityMat.uniforms.uTime.value = reduced ? 0 : now;
  placeLabels();
  if (bloomOn) composer.render(); else renderer.render(scene, camera);
}
frame();
</script>
